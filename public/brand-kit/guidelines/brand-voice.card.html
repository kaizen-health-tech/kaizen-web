<body><div class="r"><div style="flex:1;padding:16px;border:1px solid var(--color-border);border-radius:16px"><div class="kz-title-sm" style="color:var(--color-primary)">Reassuring, not dismissive</div><div class="kz-body-sm" style="color:var(--color-text-muted);margin-top:4px">Acknowledge concern; never wave it away.</div></div><div style="flex:1;padding:16px;border:1px solid var(--color-border);border-radius:16px"><div class="kz-title-sm" style="color:var(--color-primary)">Clear, not reductive</div><div class="kz-body-sm" style="color:var(--color-text-muted);margin-top:4px">Plain language that still respects nuance.</div></div><div style="flex:1;padding:16px;border:1px solid var(--color-border);border-radius:16px"><div class="kz-title-sm" style="color:var(--color-primary)">Capable, not clinical</div><div class="kz-body-sm" style="color:var(--color-text-muted);margin-top:4px">Confident and warm, not cold or sterile.</div></div><div style="flex:1;padding:16px;border:1px solid var(--color-border);border-radius:16px"><div class="kz-title-sm" style="color:var(--color-primary)">Human, not cute</div><div class="kz-body-sm" style="color:var(--color-text-muted);margin-top:4px">Friendly like a good nurse — never gimmicky.</div></div></div></body></html>
