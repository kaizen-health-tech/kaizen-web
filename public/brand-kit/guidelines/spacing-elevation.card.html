<!-- @dsCard group="Spacing" viewport="700x160" name="Elevation" subtitle="Soft plum-tinted shadows lift cards & sheets" -->
<!DOCTYPE html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>body{margin:0;padding:20px;background:var(--color-surface);font-family:var(--font-sans);color:var(--color-on-surface)}.r{display:flex;gap:24px;padding:14px 4px}</style></head>
<body><div class="r">
   <div style="flex:1;height:90px;background:var(--color-surface);border:1px solid var(--color-border);border-radius:16px;box-shadow:var(--shadow-soft);display:grid;place-items:center;font:600 12px var(--font-sans);color:var(--color-text-muted)">shadow-soft</div>
   <div style="flex:1;height:90px;background:var(--color-surface);border:1px solid var(--color-border);border-radius:16px;box-shadow:var(--shadow);display:grid;place-items:center;font:600 12px var(--font-sans);color:var(--color-text-muted)">shadow</div>
   <div style="flex:1;height:90px;background:var(--color-surface);border:1px solid var(--color-border);border-radius:16px;box-shadow:var(--shadow-lg);display:grid;place-items:center;font:600 12px var(--font-sans);color:var(--color-text-muted)">shadow-lg</div>
 </div></body></html>
