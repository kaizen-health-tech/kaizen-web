<!DOCTYPE html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>body{margin:0;padding:20px;background:var(--color-surface);font-family:var(--font-sans);color:var(--color-on-surface)}.r{display:flex;gap:16px;height:150px}</style></head>
<body><div class="r">
   <div style="flex:1.3;border-radius:20px;background:linear-gradient(145deg,#6E40F3,#5338A0 60%,#201839);display:grid;place-items:center;padding:32px"><img src="../assets/kaizen_logo.svg" alt="Kaizen Health logo, white on brand purple" style="width:78%;max-width:300px"></div>
   <div style="flex:1;border-radius:20px;border:1px solid var(--color-border);background:var(--lavender);display:grid;place-items:center;padding:32px"><img src="../assets/kaizen_logo_midnight.svg" alt="Kaizen Health logo, midnight on light background" style="width:80%;max-width:260px"></div>
 </div></body></html>
