<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Kaizen Health — Mobile UI Kit</title>
<link rel="stylesheet" href="../../styles.css">
<style>
  html,body{margin:0}
  body{background:var(--dark-plum);font-family:var(--font-sans);min-height:100vh;display:grid;place-items:center;padding:28px;box-sizing:border-box;
    background-image:radial-gradient(circle at 80% 8%,rgba(110,64,243,.5),transparent 34%),radial-gradient(circle at 8% 92%,rgba(102,230,181,.22),transparent 34%)}
  .phone{width:390px;height:auto;background:#000;border-radius:52px;padding:11px;box-shadow:0 40px 90px rgba(0,0,0,.5)}
  .screen{position:relative;width:368px;height:720px;background:var(--color-background);border-radius:42px;overflow:hidden;display:flex;flex-direction:column}
  .statusbar{height:44px;display:flex;align-items:center;justify-content:space-between;padding:0 26px;flex-shrink:0}
  .statusbar .time{font-weight:700;font-size:14px;color:var(--color-on-background)}
  .statusbar .icons{display:flex;gap:6px;align-items:center;color:var(--color-on-background)}
  .body{flex:1;overflow-y:auto;overflow-x:hidden}
  .body::-webkit-scrollbar{display:none}
  .pad{padding:0 20px}
  .stack{display:flex;flex-direction:column}
  a{color:var(--color-primary)}
</style></head>
<body>
<div id="root"></div>
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script src="../../assets/kaizen-icons.js"></script>
<script src="../../_ds_bundle.js"></script>
<script type="text/babel" src="./screens.jsx"></script>
</body></html>
